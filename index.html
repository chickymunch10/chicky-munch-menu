<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chicky Munch</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🍗 CHICKY MUNCH</h1>

<input type="text"
id="search"
placeholder="Search Menu...">

</header>

<div id="categories">

<button class="active">All</button>
<button>Burgers</button>
<button>Pizza</button>
<button>Wraps</button>
<button>Pasta</button>
<button>Platters</button>
<button>Add Ons</button>
<button>Deals</button>

</div>

<section id="products">

</section>

<div id="cart">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3>Total Rs:
<span id="total">0</span>

</h3>

<input
id="customer"
placeholder="Customer Name">

<input
id="phone"
placeholder="Phone Number">

<textarea
id="address"
placeholder="Delivery Address">
</textarea>

<button id="order">

Place Order On WhatsApp

</button>

</div>

  <button id="cartBtn">
🛒 Cart (<span id="cartCount">0</span>)
  </button>

<script src="menu.js"></script>

<script src="script.js"></script>

</body>
</html>
